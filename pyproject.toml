[tool.ruff]
target-version = "py313"

lint.select = [
    # pycodestyle
    "E",
    # pycodestyle warnings
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-unused-arguments
    "ARG",
    # FastAPI
    "FAST",
]

lint.extend-safe-fixes = [
    "FAST002", # Use 'Annotated' in endpoint parameters
]

lint.isort.force-single-line = true

[tool.mypy]
python_version = "3.13"
strict = true
